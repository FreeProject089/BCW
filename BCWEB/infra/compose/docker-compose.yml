# BetterCommunity Web — full stack, one command: `docker compose up -d`.
# Copy .env.example -> .env and fill the secrets first.

name: bcweb

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bcweb}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback ONLY — 127.0.0.1, never 0.0.0.0. Without the explicit host, Docker publishes on
    # every interface and Postgres is reachable from the network, which on a machine that also
    # serves the site is the whole database one misconfigured firewall away.
    #
    # Published because the API test suite cannot otherwise be run the way CI runs it: from the
    # host the port was closed, so a hand-made DATABASE_URL connected to nothing and ~31
    # DB-touching tests FAILED — a convincing wrong answer, not an error. Running them inside
    # the api container is not the fix either: it has no /web and no /packages, so tests that
    # read those files die on ENOENT, and the running server's sweeper fails rollup by itself.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcweb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AUTH always on (audit hardening) — the default only matters inside the compose
    # network (redis publishes no ports); override REDIS_PASSWORD in .env for prod.
    command: ["redis-server", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD:-bcweb-redis-internal}"]
    volumes:
      - redis-data:/data

  # ── PgBouncer (OPT-IN connection pooler) ──────────────────────────────────────
  # Only starts with `--profile pgbouncer`. It matters once you run more than one API
  # replica — it shares a small pool of real Postgres connections across all of them
  # (queries are 1–3 ms, so the ceiling is connection count, not query time). To use:
  #   1) start it:  docker compose --profile pgbouncer up -d
  #   2) point the API at it in .env:
  #        DB_HOST=pgbouncer  DB_PORT=6432  DB_URL_PARAMS=?pgbouncer=true
  #      (DIRECT_DATABASE_URL stays on db:5432 for migrations — handled below).
  pgbouncer:
    # Pinned, bumped on purpose (F10-13): `latest` changed under a running deploy with no diff
    # to review. v1.25.2-p0 = PgBouncer 1.25.2, the newest tag on 2026-09-24.
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    profiles: ["pgbouncer"]
    environment:
      # Defaults to the bundled db; point at a managed/remote Postgres by setting
      # PGBOUNCER_UPSTREAM_HOST/PORT in .env (so the pooler can front barreau ② too).
      DB_HOST: ${PGBOUNCER_UPSTREAM_HOST:-db}
      DB_PORT: "${PGBOUNCER_UPSTREAM_PORT:-5432}"
      DB_USER: ${POSTGRES_USER:-bcweb}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-bcweb}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
    depends_on:
      db:
        condition: service_healthy

  # S3-compatible object storage for catalog payloads, preset .json, repo data.
  # The browser PUTs/GETs via pre-signed URLs (the signature is bound to the public host —
  # see S3_PUBLIC_ENDPOINT). In production it reaches storage THROUGH CADDY on S3_DOMAIN, never
  # on :9000 directly.
  #
  # Versity S3 Gateway (versitygw, Apache-2.0) with its POSIX backend. It replaced MinIO on
  # 2026-09-24: MinIO removed minio/minio from Docker Hub on 2026-09-11 and quay.io refuses
  # anonymous pulls, so a FRESH host could no longer deploy this stack at all. Why this server
  # and not Garage / SeaweedFS / RustFS: guides/reference/ADR_S3_STORAGE_EN.md. Moving the
  # data of an existing MinIO install: guides/run/DEPLOY_EN.md → "Moving off MinIO".
  storage:
    # Pinned (F10-13), bumped on purpose. v1.8.0 = the newest release on 2026-09-24.
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    # Non-root. The image itself runs as root; volume-perms (below) hands /data to 1000 first.
    user: "1000:1000"
    depends_on:
      volume-perms:
        condition: service_completed_successfully
    # One bucket = one directory under /data/buckets, one object = one plain FILE at
    # /data/buckets/<bucket>/<key>. Each object's Content-Type and ETag live in the SIDECAR
    # directory /data/meta, not in xattrs: infra/backup/backup.sh archives this volume with
    # busybox tar, which drops xattrs: measured, a PNG stored in xattr mode came back from a
    # tar restore as text/plain. Both directories are in the one volume, so one tar holds both.
    # Port 9000 inside the container too, so S3_ENDPOINT, the Caddy upstream and any proxy that
    # already pointed at :9000 keep their address.
    command: ["--port", ":9000", "--health", "/health", "--quiet", "posix", "--sidecar", "/data/meta", "/data/buckets"]
    # Loopback ONLY (SECURITY_SUMMARY §9 #2). Docker-published ports bypass ufw on a standard
    # install. Browsers reach storage through Caddy (S3_DOMAIN); locally the browser runs on
    # this machine, so http://localhost:9000 still answers. There is no admin console any more
    # (MinIO's was :9001); versitygw's optional WebUI is deliberately not switched on.
    ports: ["127.0.0.1:${S3_HOST_PORT:-9000}:9000"]
    environment:
      # Single-account mode: these two ARE the credentials; nothing is written into the data,
      # so rotating them is an .env change + a restart of storage, api and provisioner.
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      # The region the gateway checks SigV4 signatures against: the one the api signs with.
      VGW_REGION: ${S3_REGION:-us-east-1}
      # Allow the browser to PUT/GET pre-signed objects directly from the web origin. Applied
      # to every bucket that has no CORS configuration of its own (none does; the api sets none).
      VGW_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOW_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 3s
    volumes:
      - s3-data:/data

  # One-shot: hands the api's writable volume to the `node` user the api now runs as
  # (SECURITY_SUMMARY §9 #10, F10-12). A FRESH volume needs nothing, Docker copies the image's
  # node-owned /var/audit into it; a volume created while the api ran as root keeps root
  # ownership, and the api would then fail to write the audit anchor, quietly. Runs as root
  # for exactly one chown, exits, and the api waits for it (service_completed_successfully).
  # It does the same for object storage, which runs as 1000 too: a fresh s3-data volume is
  # root-owned and empty, so the two directories the gateway needs are made here. `find ...
  # ! -user 1000` rather than `chown -R`: it only rewrites what is wrong (a restore run as
  # another user), instead of touching every object on every `up`.
  volume-perms:
    image: node:22-alpine
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /var/audit && mkdir -p /var/s3/buckets /var/s3/meta && find /var/s3 ! -user 1000 -exec chown 1000:1000 {} +"]
    volumes:
      - audit-anchor:/var/audit
      - s3-data:/var/s3

  api:
    build:
      context: ../..                 # BCWEB root (needs packages/db)
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Published so the Vite dev server (apps/web `npm run dev`, proxy /api -> :3000)
    # can reach the API when running the frontend outside Docker. Caddy still routes
    # /api internally in the full-stack run.
    # A RANGE, not a single port. `ports: ["3000:3000"]` makes `--scale api=3` fail on the
    # spot — three containers cannot each bind host 3000 — and the error names the port, not
    # the reason. With a range Docker hands each replica the next free one, the first still
    # gets 3000 (so the Vite dev proxy and every local curl keep working), and scaling up is
    # a flag with nothing else to change.
    # Loopback ONLY (SECURITY_SUMMARY §9 #2). On every interface the API was reachable around
    # the edge: it then trusts a client-written X-Forwarded-For (rate limits, bans, audit IPs),
    # and skips Caddy's /api/domains/ask block and every security header. The Vite proxy and a
    # local curl both dial 127.0.0.1, so nothing in the dev flow needs more.
    ports: ["127.0.0.1:3000-3009:3000"]
    # How many API replicas, as a SETTING rather than a flag you have to remember.
    #
    # `--scale api=3` only lasts until the next `docker compose up -d` — and `infra/deploy.sh`
    # runs exactly that, with no --scale. So on a scaled deployment every routine deploy would
    # quietly drop the API back to one container: no error, no warning, just a third of the
    # capacity and a site that gets slow for reasons nobody can see in a log.
    #
    # Set API_REPLICAS in .env instead and the count survives deploys, restarts and deploy.sh.
    # Defaults to 1, so a single-VPS install behaves exactly as before.
    deploy:
      replicas: ${API_REPLICAS:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # The api runs as `node` (uid 1000) now; its audit-anchor volume may predate that.
      volume-perms:
        condition: service_completed_successfully
    environment:
      # Runtime URL — defaults to a DIRECT connection (DB_HOST=db). Set DB_HOST=pgbouncer,
      # DB_PORT=6432, DB_URL_PARAMS=?pgbouncer=true in .env to route through the pooler.
      # A full DATABASE_URL set in .env WINS (→ managed / separate-server Postgres,
      # barreau ②); otherwise it's composed from the parts below (bundled db, or
      # pgbouncer when DB_HOST=pgbouncer). Switching to a managed DB is a pure .env flip.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-bcweb}${DB_URL_PARAMS:-}}
      # Migrations / db push always use a DIRECT connection (a pooler can't run them).
      # On a managed DB, set DIRECT_DATABASE_URL in .env to its direct (non-pooled) endpoint.
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bcweb}}
      REDIS_URL: redis://:${REDIS_PASSWORD:-bcweb-redis-internal}@redis:6379
      # S3-compatible storage. Default = the bundled `storage` service (versitygw). Swapping
      # to Cloudflare R2 is env-only: set S3_ENDPOINT/S3_PUBLIC_ENDPOINT/S3_REGION=auto + creds
      # in .env (see guides/DEPLOY_EN.md "Object storage" for the full migration).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-bcweb}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      SITE_URL: ${SITE_URL:-http://localhost:5176}
      # Scope the session cookie to the parent domain so it also reaches the telemetry
      # sub-domain (telemetry.<domain>), which the edge forward_auth gate needs. Dev
      # default `localhost` covers localhost + telemetry.localhost. PRODUCTION MUST set
      # this to `.your-domain.com` (leading dot) — the localhost default would be
      # rejected by the browser on a real domain and break login.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Ko-fi webhook verification token — if set, wins over the admin-set token and
      # locks it in the dashboard (same pattern as DISCORD_TOKEN). Blank = admin-managed.
      KOFI_WEBHOOK_TOKEN: ${KOFI_WEBHOOK_TOKEN:-}
      LINK_LOOKUP_SECRET: ${LINK_LOOKUP_SECRET:-dev-link-secret}
      # HMAC key for the tamper-evident audit chain. Unset → the code falls back to JWT_SECRET.
      # Changing it after entries exist invalidates verification of the earlier ones.
      AUDIT_SECRET: ${AUDIT_SECRET:-}
      # BMM telemetry SSO handoff (signs with LINK_LOOKUP_SECRET, which the telemetry
      # service verifies as BC_LINK_SECRET) + read-only DB access for the DB viewer.
      # The URL the SSO "open telemetry" button sends the admin to — must be the SAME
      # host Caddy serves telemetry on (TELEMETRY_DOMAIN), or you get an empty response.
      TELEMETRY_PUBLIC_URL: ${TELEMETRY_PUBLIC_URL:-${TELEMETRY_DOMAIN:-http://telemetry.localhost}}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-postgres://bmm:bmm@telemetry-db:5432/telemetry}
      # Server-to-server so BCWEB Hosting settings can edit the telemetry service's
      # runtime config (storage limit / retention / erase delay) live. Admin key must
      # match the telemetry service's ADMIN_KEY (same TELEMETRY_ADMIN_KEY var below).
      TELEMETRY_INTERNAL_URL: ${TELEMETRY_INTERNAL_URL:-http://telemetry:8900}
      TELEMETRY_ADMIN_KEY: ${TELEMETRY_ADMIN_KEY:-change-me-admin}
      # The PUBLIC ingest key, so a signed-in user can file a GDPR export / erasure request
      # for one of their linked BMM installs from Settings (POST /me/telemetry/data-request
      # → the service's /data-request). Same value the telemetry service gets as API_KEY.
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-bmm_pk_a8bc7a0dba3faca94dd497aab3c4a5e8d56f13fb}
      DISCORD_CONTACT_WEBHOOK: ${DISCORD_CONTACT_WEBHOOK:-}
      # Operator knobs. Compose must forward these or setting them in .env does NOTHING in
      # Docker — the container simply never sees them and the code falls back to its default.
      # Per-IP request budget. The 600/min default is generous for a human (~10 req/s) and is
      # what keeps the DB safe under abuse — keep it in production. Raise it only to benchmark
      # raw route capacity (loadtest/), where the limiter otherwise sheds the flood as 429s.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-}
      # Cap (MB) on the admin "download the whole repo as one zip" review endpoint. The export
      # streams, so this bounds transfer size, not memory. Default 250.
      REPO_EXPORT_MAX_MB: ${REPO_EXPORT_MAX_MB:-}
      # V8 old-space cap. The image already sets a 384 MB default (V8 sizes its heap from the
      # HOST's RAM and ignores the cgroup limit, so an unbounded heap gets OOM-killed instead
      # of collecting). Override here in tandem with the container's memory limit.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
      # Transactional email (account confirmation + password reset). Off unless EMAIL_ENABLED=true.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-dev-bot-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Shared with caddy (its on_demand_tls `ask`), F10-10. It reached no container before, so
      # /domains/ask answered anyone who could reach the API. Set a long random value in prod.
      DOMAIN_ASK_KEY: ${DOMAIN_ASK_KEY:-}
      # Append-only anchor for the tamper-evident audit log (sensitive-action hashes).
      # A dedicated volume mounted OUTSIDE /app so neither the DB viewer nor the
      # /app-confined file manager can reach it — closes the end-truncation gap.
      # The first-install seed reads these. They lived in .env and were NEVER passed in, so
      # `docker compose exec api node src/setup.mjs` created the admin as change-me-now — or, with
      # NODE_ENV=production (which IS passed), refused to seed at all, because seed.mjs fails
      # closed on a missing password. Either way the documented first-install path could not
      # complete inside Docker, and the operator had to re-run it by hand with `-e`.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # laya (agent-laya-bcweb): the OPTIONAL AI provider layer (apps/api/src/lib/moderation/ai.mjs,
      # guides/run/AI_LAYA_EN.md). All empty = AI stays off until an admin picks a provider; set
      # here, a value WINS over the admin screen. AI_KILL_SWITCH=1 cuts AI whatever the screen
      # says (the rules keep running). The external URL and key live ONLY here: never in the
      # database, never in a log, never sent to a browser.
      LAYA_URL: ${LAYA_URL:-http://laya:8000}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_KILL_SWITCH: ${AI_KILL_SWITCH:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-}
      AI_EXTERNAL_URL: ${AI_EXTERNAL_URL:-}
      AI_EXTERNAL_KEY: ${AI_EXTERNAL_KEY:-}
      AI_EXTERNAL_ALLOW_PRIVATE: ${AI_EXTERNAL_ALLOW_PRIVATE:-}
      # aios (agent-bcw-ai-os): seals the AI keys stored in the database (members' own keys and
      # the site key, lib/ai-keys.mjs). Empty = derived from JWT_SECRET. Changing it makes every
      # stored key unreadable (they have to be entered again), never readable by the wrong party.
      AI_KEYS_SECRET: ${AI_KEYS_SECRET:-}
      AUDIT_ANCHOR_DIR: /var/audit
      NODE_ENV: production
    # laya (agent-laya-bcweb): `ai` is the internal network the Laya sidecar lives on. Joining it
    # costs nothing when the sidecar is not started; `default` keeps everything else as it was.
    networks: [default, ai]
    volumes:
      - audit-anchor:/var/audit
      # The two codebase maps that read FILES rather than the database: the infra map wants
      # .github/workflows, the compose map wants the compose file itself. Neither is copied
      # into the image — deliberately, an API image has no business shipping CI config — so
      # both returned 404 on every deployed instance and the panels could only ever say
      # "not available here".
      #
      # Read-only, and mounted rather than COPYed so the map reflects the workflows on disk
      # right now instead of the ones that happened to exist at build time — a stale infra
      # map is worse than none, because it reads as current.
      #
      # Only workflow YAML and one compose file, both of which are already in the repo. No
      # secret VALUES are in either; the map lists secret NAMES, and the route is ADMIN-only.
      # If these paths are absent (a deploy that ships only the image), the maps go back to
      # saying so — which is why the route keeps its 404 branch.
      # At the ROOT, not under /app. The route resolves four levels up from
      # /app/src/routes/devtools.mjs, which clamps to `/` — the paths were written for a
      # source checkout where the API sits four directories deep, and the image flattens it.
      # Checked by running the same path.resolve inside the container rather than assumed.
      - ../../../.github/workflows:/.github/workflows:ro
      - ./docker-compose.yml:/infra/compose/docker-compose.yml:ro
    # Lets dependents (esp. Caddy) wait until the API actually serves — otherwise the
    # telemetry origin's forward_auth hits a not-yet-listening api:3000 on every request
    # during boot and Caddy spams "connection refused / 502" until the API comes up.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Watches for PROVISIONING repos and brings them ONLINE (isolation/quota owner).
  provisioner:
    build:
      context: ../..
      dockerfile: apps/provisioner/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Provisioner talks DIRECTLY to Postgres → follows the same managed-DB override.
      DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bcweb}}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bcweb}}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-bcweb}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REPO_PUBLIC_BASE: ${REPO_PUBLIC_BASE:-http://localhost/repos}

  web:
    build:
      context: ../..                 # BCWEB root (needs packages/bmd, the B.MD kit)
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GTM_ID: ${VITE_GTM_ID:-}
    restart: unless-stopped
    depends_on: [api]
    # What the rolling deploy (infra/zdd.sh) waits on before it stops the old container.
    # nginx serving a baked-in dist is ready almost instantly, but "almost instantly" is not
    # a thing a script can wait for — a health state is. busybox wget ships in the image
    # (nginxinc/nginx-unprivileged, Alpine). Port 8080: nginx runs unprivileged (apps/web/nginx.conf).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s

  # BetterCommunity Discord bot. Idle (exits 0) unless DISCORD_TOKEN is set in .env.
  bot:
    build: ../../apps/bot
    restart: unless-stopped
    depends_on: [api]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      BCWEB_API_URL: http://api:3000
      SITE_URL: ${SITE_URL:-http://localhost:5176}
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-dev-bot-secret}

  # ── laya (agent-laya-bcweb): the OPTIONAL AI sidecar ──────────────────────────────────────
  # convaiinnovations/laya-multilingual behind `laya-serve`, CPU only. Starts ONLY with the
  # profile: `docker compose --profile ai up -d`, or COMPOSE_PROFILES=ai in .env (which is how
  # infra/deploy.sh picks it up too: compose reads .env itself). Without the profile neither
  # service exists, and the API's AI layer answers null to everything: AI off, rules only.
  # Guide: guides/run/AI_LAYA_EN.md (FR: AI_LAYA_FR.md). Image: infra/laya/Dockerfile.
  #
  # Two services, one image. `laya-fetch` runs once, on the default network (the only one with
  # a route out), and puts the checkpoint (~0.7 GB) into the `laya-models` volume. `laya` then
  # serves it OFFLINE on the internal `ai` network: no published port, no route to the
  # internet, reachable only by the API. LAYA_REVISION=reviewed pins the checkpoint to the
  # commit laya 0.3.21 reviewed (laya/revisions.py); set a commit SHA to pin another.
  laya-fetch:
    build: ../laya
    profiles: ["ai"]
    restart: "no"
    command: ["python", "/opt/fetch_model.py"]
    environment:
      LAYA_MODELS: multilingual
      LAYA_REVISION: ${LAYA_REVISION:-reviewed}
      # followups (agent-bcw-followups): checked, never used, by the image's entrypoint. This
      # one-shot runs first and `laya` waits for it, so a missing key stops the profile here.
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    volumes:
      - laya-models:/models
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  laya:
    build: ../laya
    profiles: ["ai"]
    restart: unless-stopped
    depends_on:
      laya-fetch:
        condition: service_completed_successfully
    environment:
      LAYA_DEVICE: cpu
      LAYA_MODELS: multilingual
      LAYA_MAX_LOADED: "1"
      # Threads = what the cpus limit below allows; more only thrashes (laya/serve.py says so).
      LAYA_THREADS: ${LAYA_THREADS:-2}
      LAYA_MAX_CONCURRENT: "2"
      LAYA_MAX_TOKEN_BUDGET: "1024"
      LAYA_REVISION: ${LAYA_REVISION:-reviewed}
      # The SAME value the api gets: every request carries it as a Bearer token. MANDATORY
      # (followups, agent-bcw-followups): the image's entrypoint (infra/laya/entrypoint.py)
      # refuses to start without it, and the api reports Laya "unconfigured". Set it:
      # `openssl rand -hex 32`.
      # Not `${LAYA_API_KEY:?…}`, on purpose: Compose (measured on v5.1.4) interpolates EVERY
      # service before it applies profiles, so a required variable here would make
      # `docker compose config` / `up` fail on a server that never enabled the `ai` profile.
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      LAYA_LOG_LEVEL: warning
    volumes:
      - laya-models:/models
    networks: [ai]
    # The owner's rule: AI must never eat the server. A hard ceiling on what the model can
    # take, whatever it is asked; the API's own queue, timeout and breaker sit in front of it.
    cpus: ${LAYA_CPUS:-1.5}
    mem_limit: ${LAYA_MEM_LIMIT:-2g}
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  # fin laya (agent-laya-bcweb)

  # Dedicated Postgres for the telemetry dashboard (kept isolated from the app DB).
  telemetry-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmm
      POSTGRES_PASSWORD: bmm
      POSTGRES_DB: telemetry
    volumes:
      - telemetry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmm -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20

  # BMM telemetry dashboard (moved into bmm/), listens on 8900, reachable at /telemetry.
  telemetry:
    build: ../../bmm/telemetry-dashboard
    restart: unless-stopped
    depends_on:
      telemetry-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bmm:bmm@telemetry-db:5432/telemetry
      PORT: "8900"
      # With NODE_ENV=production the ingest FAILS CLOSED if API_KEY is ever blanked
      # (CWE-306 guard in server.mjs). Harmless in dev: API_KEY is always set here.
      NODE_ENV: production
      # The PUBLIC ingest key. Not a secret: it ships inside the BMM client and only permits
      # SUBMITTING telemetry — the private one is ADMIN_KEY below. It must MATCH the value the
      # client sends (frontend/src/core/links-config.ts, analytics_key) or every upload is
      # rejected with 401 "bad key" and telemetry simply stops, with nothing on either side
      # saying why. It was `change-me` here against a client sending bmm_pk_… — measured, not
      # assumed: the shipped key returned 401 and the configured one returned 200.
      API_KEY: ${TELEMETRY_API_KEY:-bmm_pk_a8bc7a0dba3faca94dd497aab3c4a5e8d56f13fb}
      # Read by the server (config.rs) and NOT passed before, so the dashboard's own .env could
      # say RETENTION_DAYS=30 while Docker silently kept the 180-day default. A retention
      # setting that looks configurable and is not is the worst kind for a privacy knob.
      RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-180}
      DELETE_DELAY_H: ${TELEMETRY_DELETE_DELAY_H:-72}
      ADMIN_KEY: ${TELEMETRY_ADMIN_KEY:-change-me-admin}
      STATIC_DIR: /app/public
      # Resolve creator ids → linked BetterCommunity accounts (server-to-server).
      BC_API_URL: http://api:3000
      BC_LINK_SECRET: ${LINK_LOOKUP_SECRET:-dev-link-secret}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Local default: the site is served at http://localhost:5176 (SITE_DOMAIN), so
    # Caddy listens on 5176; :80 stays published for the telemetry origin, :443 for
    # production auto-HTTPS. In production point SITE_DOMAIN at your domain and the
    # 80/443 mappings handle ACME + HTTPS (see DOMAIN_SETUP.md).
    ports: ["5176:5176", "80:80", "443:443"]
    # Wait for the API to be HEALTHY (serving), not just started — otherwise the
    # telemetry forward_auth 502-spams during API boot (connection refused).
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-http://localhost:5176}
      # Set by infra/tunnel.mjs while a tunnel is up; an unreachable default otherwise.
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN:-http://tunnel.invalid}
      TELEMETRY_DOMAIN: ${TELEMETRY_DOMAIN:-http://telemetry.localhost}
      # Second address for the dashboard, for a real domain with real subdomains. NOT usable
      # with a quick tunnel — the forward_auth gate needs the site's cookie, and two
      # unrelated *.trycloudflare.com hostnames cannot share one. See the Caddyfile.
      TELEMETRY_TUNNEL_DOMAIN: ${TELEMETRY_TUNNEL_DOMAIN:-http://telemetry-tunnel.invalid}
      # Object storage on its own origin. Unset → an unreachable default, so the block in the
      # Caddyfile never matches and storage stays reachable only on :9000 as it is locally.
      S3_DOMAIN: ${S3_DOMAIN:-http://s3.invalid}
      # F10-10: the Caddyfile reads both and neither reached the container, so `ask` sent an
      # empty key and the customer-domain block could never be switched on from .env.
      DOMAIN_ASK_KEY: ${DOMAIN_ASK_KEY:-}
      CUSTOM_DOMAIN_MATCHER: ${CUSTOM_DOMAIN_MATCHER:-http://custom-domains.invalid}
      # The site CSP's connect-src (§9 #5) names the storage origin the browser PUTs to, so
      # Caddy needs the same value the api signs into every pre-signed URL.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Extra origins the browser may fetch from (space-separated), for a live B.MD block or a
      # project's live number on another host. Empty = the site, storage, and the fixed list.
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  redis-data:
  # Object storage (versitygw). `minio-data` is no longer declared: an existing one stays on
  # disk untouched (compose never deletes a volume it does not declare) until the migration in
  # guides/run/DEPLOY_EN.md has been verified and you remove it yourself.
  s3-data:
  telemetry-data:
  caddy-data:
  caddy-config:
  audit-anchor:
  # laya (agent-laya-bcweb): the Laya checkpoint (~0.7 GB), filled once by laya-fetch.
  laya-models:

# laya (agent-laya-bcweb): the AI sidecar's network. `internal: true` = no route to or from
# outside the host's containers on it (the api and the sidecar). Everything else stays on the
# implicit `default` network, exactly as before.
networks:
  ai:
    internal: true
