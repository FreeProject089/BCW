# BetterCommunity Web — full stack, one command: `docker compose up -d`.
# Copy .env.example -> .env and fill the secrets first.

name: bcweb

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bcweb}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcweb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AUTH always on (audit hardening) — the default only matters inside the compose
    # network (redis publishes no ports); override REDIS_PASSWORD in .env for prod.
    command: ["redis-server", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD:-bcweb-redis-internal}"]
    volumes:
      - redis-data:/data

  # ── PgBouncer (OPT-IN connection pooler) ──────────────────────────────────────
  # Only starts with `--profile pgbouncer`. It matters once you run more than one API
  # replica — it shares a small pool of real Postgres connections across all of them
  # (queries are 1–3 ms, so the ceiling is connection count, not query time). To use:
  #   1) start it:  docker compose --profile pgbouncer up -d
  #   2) point the API at it in .env:
  #        DB_HOST=pgbouncer  DB_PORT=6432  DB_URL_PARAMS=?pgbouncer=true
  #      (DIRECT_DATABASE_URL stays on db:5432 for migrations — handled below).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    profiles: ["pgbouncer"]
    environment:
      # Defaults to the bundled db; point at a managed/remote Postgres by setting
      # PGBOUNCER_UPSTREAM_HOST/PORT in .env (so the pooler can front barreau ② too).
      DB_HOST: ${PGBOUNCER_UPSTREAM_HOST:-db}
      DB_PORT: "${PGBOUNCER_UPSTREAM_PORT:-5432}"
      DB_USER: ${POSTGRES_USER:-bcweb}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-bcweb}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
    depends_on:
      db:
        condition: service_healthy

  # S3-compatible object storage for catalog payloads, preset .json, repo data.
  # Port 9000 is exposed so the browser can PUT/GET via pre-signed URLs (the
  # signature is bound to the public host — see S3_PUBLIC_ENDPOINT).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      # Allow the browser to PUT/GET pre-signed objects directly from the web origin.
      # (Default is already "*", set explicitly so direct-to-storage uploads never 404
      #  on a CORS preflight regardless of the MinIO version.)
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../..                 # BCWEB root (needs packages/db)
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Published so the Vite dev server (apps/web `npm run dev`, proxy /api -> :3000)
    # can reach the API when running the frontend outside Docker. Caddy still routes
    # /api internally in the full-stack run.
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Runtime URL — defaults to a DIRECT connection (DB_HOST=db). Set DB_HOST=pgbouncer,
      # DB_PORT=6432, DB_URL_PARAMS=?pgbouncer=true in .env to route through the pooler.
      # A full DATABASE_URL set in .env WINS (→ managed / separate-server Postgres,
      # barreau ②); otherwise it's composed from the parts below (bundled db, or
      # pgbouncer when DB_HOST=pgbouncer). Switching to a managed DB is a pure .env flip.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-bcweb}${DB_URL_PARAMS:-}}
      # Migrations / db push always use a DIRECT connection (a pooler can't run them).
      # On a managed DB, set DIRECT_DATABASE_URL in .env to its direct (non-pooled) endpoint.
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bcweb}}
      REDIS_URL: redis://:${REDIS_PASSWORD:-bcweb-redis-internal}@redis:6379
      # S3-compatible storage. Default = the bundled MinIO. Swapping to Cloudflare R2
      # is env-only: set S3_ENDPOINT/S3_PUBLIC_ENDPOINT/S3_REGION=auto + creds in .env
      # (see guides/DEPLOY_EN.md "Object storage" for the full migration).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-bcweb}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      SITE_URL: ${SITE_URL:-http://localhost:5176}
      # Scope the session cookie to the parent domain so it also reaches the telemetry
      # sub-domain (telemetry.<domain>), which the edge forward_auth gate needs. Dev
      # default `localhost` covers localhost + telemetry.localhost. PRODUCTION MUST set
      # this to `.your-domain.com` (leading dot) — the localhost default would be
      # rejected by the browser on a real domain and break login.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Ko-fi webhook verification token — if set, wins over the admin-set token and
      # locks it in the dashboard (same pattern as DISCORD_TOKEN). Blank = admin-managed.
      KOFI_WEBHOOK_TOKEN: ${KOFI_WEBHOOK_TOKEN:-}
      LINK_LOOKUP_SECRET: ${LINK_LOOKUP_SECRET:-dev-link-secret}
      # HMAC key for the tamper-evident audit chain. Unset → the code falls back to JWT_SECRET.
      # Changing it after entries exist invalidates verification of the earlier ones.
      AUDIT_SECRET: ${AUDIT_SECRET:-}
      # BMM telemetry SSO handoff (signs with LINK_LOOKUP_SECRET, which the telemetry
      # service verifies as BC_LINK_SECRET) + read-only DB access for the DB viewer.
      # The URL the SSO "open telemetry" button sends the admin to — must be the SAME
      # host Caddy serves telemetry on (TELEMETRY_DOMAIN), or you get an empty response.
      TELEMETRY_PUBLIC_URL: ${TELEMETRY_PUBLIC_URL:-${TELEMETRY_DOMAIN:-http://telemetry.localhost}}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-postgres://bmm:bmm@telemetry-db:5432/telemetry}
      # Server-to-server so BCWEB Hosting settings can edit the telemetry service's
      # runtime config (storage limit / retention / erase delay) live. Admin key must
      # match the telemetry service's ADMIN_KEY (same TELEMETRY_ADMIN_KEY var below).
      TELEMETRY_INTERNAL_URL: ${TELEMETRY_INTERNAL_URL:-http://telemetry:8900}
      TELEMETRY_ADMIN_KEY: ${TELEMETRY_ADMIN_KEY:-change-me-admin}
      DISCORD_CONTACT_WEBHOOK: ${DISCORD_CONTACT_WEBHOOK:-}
      # Operator knobs. Compose must forward these or setting them in .env does NOTHING in
      # Docker — the container simply never sees them and the code falls back to its default.
      # Per-IP request budget. The 600/min default is generous for a human (~10 req/s) and is
      # what keeps the DB safe under abuse — keep it in production. Raise it only to benchmark
      # raw route capacity (loadtest/), where the limiter otherwise sheds the flood as 429s.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-}
      # Cap (MB) on the admin "download the whole repo as one zip" review endpoint. The export
      # streams, so this bounds transfer size, not memory. Default 250.
      REPO_EXPORT_MAX_MB: ${REPO_EXPORT_MAX_MB:-}
      # V8 old-space cap. The image already sets a 384 MB default (V8 sizes its heap from the
      # HOST's RAM and ignores the cgroup limit, so an unbounded heap gets OOM-killed instead
      # of collecting). Override here in tandem with the container's memory limit.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
      # Transactional email (account confirmation + password reset). Off unless EMAIL_ENABLED=true.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-${LINK_LOOKUP_SECRET:-dev-bot-secret}}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Append-only anchor for the tamper-evident audit log (sensitive-action hashes).
      # A dedicated volume mounted OUTSIDE /app so neither the DB viewer nor the
      # /app-confined file manager can reach it — closes the end-truncation gap.
      AUDIT_ANCHOR_DIR: /var/audit
      NODE_ENV: production
    volumes:
      - audit-anchor:/var/audit
    # Lets dependents (esp. Caddy) wait until the API actually serves — otherwise the
    # telemetry origin's forward_auth hits a not-yet-listening api:3000 on every request
    # during boot and Caddy spams "connection refused / 502" until the API comes up.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Watches for PROVISIONING repos and brings them ONLINE (isolation/quota owner).
  provisioner:
    build:
      context: ../..
      dockerfile: apps/provisioner/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Provisioner talks DIRECTLY to Postgres → follows the same managed-DB override.
      DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bcweb}}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER:-bcweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bcweb}}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-bcweb}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REPO_PUBLIC_BASE: ${REPO_PUBLIC_BASE:-http://localhost/repos}

  web:
    build:
      context: ../../apps/web
      args:
        VITE_GTM_ID: ${VITE_GTM_ID:-}
    restart: unless-stopped
    depends_on: [api]

  # BetterCommunity Discord bot. Idle (exits 0) unless DISCORD_TOKEN is set in .env.
  bot:
    build: ../../apps/bot
    restart: unless-stopped
    depends_on: [api]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      BCWEB_API_URL: http://api:3000
      SITE_URL: ${SITE_URL:-http://localhost:5176}
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-${LINK_LOOKUP_SECRET:-dev-bot-secret}}

  # Dedicated Postgres for the telemetry dashboard (kept isolated from the app DB).
  telemetry-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmm
      POSTGRES_PASSWORD: bmm
      POSTGRES_DB: telemetry
    volumes:
      - telemetry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmm -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20

  # BMM telemetry dashboard (moved into bmm/), listens on 8900, reachable at /telemetry.
  telemetry:
    build: ../../bmm/telemetry-dashboard
    restart: unless-stopped
    depends_on:
      telemetry-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bmm:bmm@telemetry-db:5432/telemetry
      PORT: "8900"
      # With NODE_ENV=production the ingest FAILS CLOSED if API_KEY is ever blanked
      # (CWE-306 guard in server.mjs). Harmless in dev: API_KEY is always set here.
      NODE_ENV: production
      API_KEY: ${TELEMETRY_API_KEY:-change-me}
      ADMIN_KEY: ${TELEMETRY_ADMIN_KEY:-change-me-admin}
      STATIC_DIR: /app/public
      # Resolve creator ids → linked BetterCommunity accounts (server-to-server).
      BC_API_URL: http://api:3000
      BC_LINK_SECRET: ${LINK_LOOKUP_SECRET:-dev-link-secret}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Local default: the site is served at http://localhost:5176 (SITE_DOMAIN), so
    # Caddy listens on 5176; :80 stays published for the telemetry origin, :443 for
    # production auto-HTTPS. In production point SITE_DOMAIN at your domain and the
    # 80/443 mappings handle ACME + HTTPS (see DOMAIN_SETUP.md).
    ports: ["5176:5176", "80:80", "443:443"]
    # Wait for the API to be HEALTHY (serving), not just started — otherwise the
    # telemetry forward_auth 502-spams during API boot (connection refused).
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-http://localhost:5176}
      TELEMETRY_DOMAIN: ${TELEMETRY_DOMAIN:-http://telemetry.localhost}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  redis-data:
  minio-data:
  telemetry-data:
  caddy-data:
  caddy-config:
  audit-anchor:
