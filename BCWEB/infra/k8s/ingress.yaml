# Idiomatic nginx-ingress routing. This is a STARTER — the live edge (Caddyfile)
# routes several prefixes to the API (/api, /hosting, /repos, /og, forward_auth for
# the telemetry subdomain, …). Port that full table here, OR (simpler) skip this file
# and run the existing Caddy container as a Deployment + LoadBalancer Service reusing
# your Caddyfile. See README.md "Two migration paths for the edge".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bcweb
  namespace: bcweb
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # requires cert-manager
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["your-domain.com"]
      secretName: bcweb-tls
  rules:
    - host: your-domain.com
      http:
        paths:
          # ⚠ Mirror EVERY API prefix from the Caddyfile here, most-specific first.
          - path: /api
            pathType: Prefix
            backend: { service: { name: bcweb-api, port: { number: 3000 } } }
          # SPA fallback — everything else → the web pods.
          - path: /
            pathType: Prefix
            backend: { service: { name: bcweb-web, port: { number: 80 } } }
