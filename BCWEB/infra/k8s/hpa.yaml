# Autoscale the API on CPU. This is the payoff K8s exists for — but recall a single
# box already handles thousands of users; you likely won't need this for a long time.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bcweb-api
  namespace: bcweb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bcweb-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
