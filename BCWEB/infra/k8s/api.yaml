# API Deployment + Service. Wires the liveness/readiness probes and graceful drain
# that already exist in apps/api/src/server.mjs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcweb-api
  namespace: bcweb
  labels: { app: bcweb-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: bcweb-api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # zero-downtime: never drop below desired count
      maxSurge: 1
  template:
    metadata:
      labels: { app: bcweb-api }
    spec:
      # > the app's 10 s internal drain budget, so SIGTERM → drain → exit finishes
      # before the kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/OWNER/bcweb-api:latest    # ← set your registry/tag
          # Override the image CMD: NO `prisma db push` here (the migrate Job owns
          # the schema so replicas don't race). Just run the server.
          command: ["node", "src/server.mjs"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: bcweb-config }
            - secretRef: { name: bcweb-secrets }
          # LIVENESS = cheap, no deps. A DB outage must NOT restart the pod.
          livenessProbe:
            httpGet: { path: /live, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # READINESS = deps reachable. 503 pulls the pod out of the Service
          # endpoints (no traffic) without killing it.
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Give the control plane a moment to remove this pod from Service
            # endpoints BEFORE SIGTERM, so no new request lands on a draining pod.
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: bcweb-api
  namespace: bcweb
spec:
  selector: { app: bcweb-api }
  ports:
    - port: 3000
      targetPort: 3000
