# Non-secret runtime config. Secrets (DB URL, JWT, Stripe, S3 keys…) live in the
# Secret, never here. Mirror of the non-sensitive half of infra/compose/.env.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bcweb-config
  namespace: bcweb
data:
  NODE_ENV: "production"
  PORT: "3000"
  SITE_URL: "https://your-domain.com"
  # Leading dot so the session cookie also reaches telemetry.<domain> (forward_auth).
  COOKIE_DOMAIN: ".your-domain.com"
  # Object storage → Cloudflare R2 (keys go in the Secret).
  S3_REGION: "auto"
  S3_BUCKET: "bcweb"
  S3_ENDPOINT: "https://<accountid>.r2.cloudflarestorage.com"
  S3_PUBLIC_ENDPOINT: "https://cdn.your-domain.com"
