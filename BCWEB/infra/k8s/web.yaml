# Web (static SPA served by nginx) Deployment + Service. Stateless → scales freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcweb-web
  namespace: bcweb
  labels: { app: bcweb-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: bcweb-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: bcweb-web }
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: ghcr.io/OWNER/bcweb-web:latest     # ← set your registry/tag
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: "20m",  memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: bcweb-web
  namespace: bcweb
spec:
  selector: { app: bcweb-web }
  ports:
    - port: 80
      targetPort: 80
