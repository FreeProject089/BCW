# TEMPLATE ONLY — same role as infra/compose/.env.example. Copy to secret.yaml
# (gitignored), fill real values, `kubectl apply -f secret.yaml`. NEVER commit real
# secrets. Prefer a managed store (External Secrets Operator / Sealed Secrets / your
# cloud's secret manager) over a raw Secret in production.
apiVersion: v1
kind: Secret
metadata:
  name: bcweb-secrets
  namespace: bcweb
type: Opaque
stringData:
  # Managed Postgres. DIRECT_* is used by the migrate Job (poolers can't run DDL);
  # DATABASE_URL can point at PgBouncer/the pooled endpoint for the API.
  DATABASE_URL: "postgresql://user:pass@managed-db-host:5432/bcweb"
  DIRECT_DATABASE_URL: "postgresql://user:pass@managed-db-host:5432/bcweb"
  # Managed Redis (rediss:// = TLS).
  REDIS_URL: "rediss://:password@managed-redis-host:6379"
  JWT_SECRET: "GENERATE-A-STRONG-RANDOM-VALUE"
  LINK_LOOKUP_SECRET: "GENERATE-A-STRONG-RANDOM-VALUE"
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  # NOTE: the Discord bot token is highly sensitive — keep it only here, never in a
  # ConfigMap or committed file.
  DISCORD_TOKEN: ""
