name: BCWEB CI

# Minimal safety net (see BCWEB/guides/TECH_AUDIT_EN.md §4, P1): catch a broken build,
# a broken API module, an invalid Prisma schema, or a leaked secret at push/PR time —
# the classes of bug that have actually bitten this project. No infra needed; all checks
# run against the source with dummy env.

on:
  push:
    # .github/** too: a change to this file, its scripts or the audit / secret-scan lists has to
    # be proven by a run, not merged on faith.
    paths: ['BCWEB/**', '.github/**']
  pull_request:
    paths: ['BCWEB/**', '.github/**']

# Least privilege for GITHUB_TOKEN. With no block at all the token gets whatever the
# repository's default is, and that default is write-all on an older repository — so every
# step here, including third-party actions pinned to MOVING tags (see below), ran with a
# token that could push to the repository. Nothing in this file writes anything: the jobs
# check out, install, build and grep. `contents: read` is the whole requirement, and it also
# means a compromised action gets a token that cannot change the repository.
#
# And every action is pinned to a full commit SHA, the tag in the comment (SECURITY_SUMMARY §9
# #3): a tag can be moved by whoever controls the action's repository, a SHA cannot.
# `dtolnay/rust-toolchain` is pinned to the commit of v1, so the toolchain is named by
# `toolchain: stable` rather than by the ref. To bump: `git ls-remote https://github.com/<owner>/
# <repo> refs/tags/<tag>` (peel an annotated tag with `^{}`), read the diff, change both.
permissions:
  contents: read

jobs:
  web-build:
    name: Web build (vite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: BCWEB/apps/web } }
    steps:
      # Full history: the legal-date check asks git when the file last changed, and a shallow
      # clone has no answer — which it reports as unverified, not as fine.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      - run: npm ci
      # Some web gates import API modules to read the one true rule (check-site-theme reads
      # apps/api/src/lib/config-schemas.mjs, which imports zod). Without the API's own
      # dependencies the lint chain died on ERR_MODULE_NOT_FOUND 'zod' at that gate, on every
      # run since it was added.
      - name: api deps (read by web gates)
        working-directory: BCWEB/apps/api
        run: npm ci
      # no-undef catches bare JSX identifiers used-but-not-imported (the render crashes).
      - run: npm run lint
      # i18n integrity: fails on duplicate dict keys (silent-override bugs) and, in
      # --strict, on any t() key used in code with no DICT.fr entry (silent EN fallback).
      - run: npm run i18n:check
      # A CSS variable that is used and never defined. Harmless in most declarations, and NOT
      # harmless inside color-mix(): the function becomes invalid, an invalid `fill` falls
      # back to black, and the code map drew every file as a black bar with black text on it.
      - run: npm run css:check
      # The "last updated" date on the legal pages must not be older than the pages. A privacy
      # policy is quoted by its date, and a wrong one looks authoritative.
      - run: npm run legal:check
      # `npm run build`, not `npx vite build`. The two are not the same command: build runs
      # check-undefined-jsx and check-lazy-named in front of vite, and those catch the two
      # failures vite cannot see — a JSX identifier the file never imported (ReferenceError the
      # moment the page draws) and a lazyNamed() pointing at an export that does not exist
      # (React #306, whose minified text names nothing). Calling vite directly meant this job,
      # whose stated purpose is catching a broken build at PR time, skipped both; they only
      # fired later, inside the web image build, at deploy time.
      - run: npm run build -- --logLevel error
      # Fail if the entry chunk (what every visitor downloads) regresses past its budget —
      # e.g. a route accidentally eager-imported instead of React.lazy'd.
      - run: npm run budget

  api-check:
    name: API syntax + Prisma + billing tests
    runs-on: ubuntu-latest
    # Throwaway Postgres so the pool-billing integration tests (recomputePoolBytes
    # invariants) run for real; the pure pricing tests need no DB either way.
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: bcwebtest }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/bcwebtest
      DIRECT_DATABASE_URL: postgresql://postgres:test@localhost:5432/bcwebtest
    defaults: { run: { working-directory: BCWEB/apps/api } }
    steps:
      # Full history: legal-freshness reads when the legal wording last changed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      # node --check every API module — catches syntax errors (build never runs the API).
      - name: node --check all API modules
        working-directory: .
        run: find BCWEB/apps/api/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      # Every variable docker-compose reads is described in .env.example, or listed as
      # internal. REPO_PUBLIC_BASE was in neither: it falls back to http://localhost/repos,
      # which is the address handed to BMM inside every hosted repo.json — so a production
      # deploy that missed it publishes repos nobody can sync, and nothing fails on the
      # server, because that address is only ever used somewhere else.
      - name: env vars documented
        run: node scripts/check-env-documented.mjs
      # The guides must describe THIS stack. check-links proves every link resolves, which a
      # guide naming a deleted service or a renamed script passes perfectly. This checks the
      # claims a reader ACTS on: every `docker compose <service>`, `npm run <script>`,
      # variable and infra/ path they are told to use has to exist. It found TOPOLOGY
      # pointing at an infra/k8s directory that is not in the repository.
      - name: guides describe the real stack
        working-directory: BCWEB
        run: node guides/check-claims.mjs
      # The seeded content is SHIPPED: every install gets these blog posts, docs, site guide
      # and FAQ, and their markdown is full of `:::card{href=/docs/…}` blocks. A renamed slug
      # or a card pointing at a page nobody wrote is invisible here — the seed succeeds, the
      # page renders, the card looks like a card. It fails for a reader, one click in, on
      # somebody else's site.
      - name: seeded content links resolve
        run: node scripts/check-seed-links.mjs
      # The markdown guide is seeded into every install and both editors link to it from a
      # "Guide" button. It documented ten directives out of thirty-two — no file cards, no
      # columns, no steps, no tabs, no buttons — because the renderer is a chain of branches in
      # apps/web and the guide is a template literal in apps/api, and nothing compared them.
      - name: the markdown guide covers the renderer
        run: node scripts/check-md-guide.mjs
      - run: npm ci
      - run: npx prisma generate --schema ../../packages/db/schema.prisma
      - run: npx prisma validate --schema ../../packages/db/schema.prisma
      # Apply the checked-in migrations (the real production boot path) to the throwaway DB…
      - run: npx prisma migrate deploy --schema ../../packages/db/schema.prisma
      # …then assert those migrations reproduce the schema EXACTLY — a schema edit without a
      # matching migration (which migrate deploy would silently skip in prod) fails here.
      - name: migrations reproduce the schema (drift check)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ../../packages/db/schema.prisma --exit-code
      # Full suite: pure pricing math + pool-billing invariants + webhook lifecycle.
      - name: tests
        run: npm test

  native:
    name: Native addon (Rust) build + native-path tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with: { toolchain: stable, components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: 'BCWEB/native' }
      # Rust quality gates (mirror the JS lints): formatting + clippy with warnings denied.
      - name: cargo fmt --check
        working-directory: BCWEB/native
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: BCWEB/native
        run: cargo clippy --release -- -D warnings
      # Rust unit tests for the pure core (zip r/w, extract, blake3, zstd, scan, resize).
      - name: cargo test (bcweb-core)
        working-directory: BCWEB/native/core
        run: cargo test
      # Build the Rust addon (BLAKE3 / off-event-loop zip / zstd / image resize). A compile
      # regression fails here rather than silently shipping the JS fallback everywhere.
      - name: build addon
        working-directory: BCWEB/native
        run: npm install --no-audit --no-fund && npx napi build --platform --release
      - name: api deps
        working-directory: BCWEB/apps/api
        run: npm ci
      # The addon must actually LOAD (else the native path is untested). The other jobs run
      # the suite WITHOUT the addon, so they cover the JS fallback; this covers the native path.
      - name: addon loads (hasNative)
        working-directory: BCWEB/apps/api
        run: node --input-type=module -e "import { hasNative } from './src/lib/native.mjs'; if (!hasNative) { console.error('native addon did not load'); process.exit(1); } console.log('hasNative OK');"
      - name: native-path tests (parity native vs JS)
        working-directory: BCWEB/apps/api
        run: node --test test/native.test.mjs

  caddyfile:
    name: Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Caddy refuses the WHOLE config over one bad directive and exits 1, which takes the
      # reverse proxy down and every site with it — while every other container stays up and
      # healthy, so the symptom is "everything started and the site is gone". That is how
      # `on_demand_tls { interval }`, removed in Caddy 2.10 and belonging to a feature nobody
      # had switched on, stopped the platform.
      #
      # Validated against the SAME image the stack runs (caddy:2-alpine in compose), because
      # the point is what that version accepts, not what the syntax looked like when it was
      # written. The env vars are placeholders: validation only needs the file to parse and
      # adapt, and the defaults in the file cover anything unset.
      - name: the Caddyfile is valid for the Caddy we run
        run: |
          docker run --rm -v "$PWD/BCWEB/infra/caddy:/w:ro" -w /w caddy:2-alpine \
            caddy validate --config Caddyfile --adapter caddyfile
      # The extra-sites machinery (infra/caddy/site.mjs): every template rendered and put
      # through the same Caddy, the generated flat file proven to adapt to the SAME JSON as
      # base + imports, entrypoint.sh's BetterCommunity-only fallback valid, and a broken or
      # duplicate drop-in proven REFUSED. A template that stops validating would otherwise be
      # found by the owner, on the server, when `site.mjs add` refuses his new site.
      - name: extra-site templates + generated Caddyfile (site.mjs selftest)
        run: node BCWEB/infra/caddy/site.mjs selftest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      # Discord bot token, Stripe secret / restricted key (live AND test) and webhook secret, and
      # private keys with a body — in every tracked file INCLUDING `*.example` (SECURITY_SUMMARY §9
      # #1: a real bot token sat in .env.example from the first commit, and the grep this replaces
      # excluded exactly those files). Empty example values match nothing, so they stay allowed.
      # *.md and guides/ stay excluded (prose quoting shapes). The grep it replaces also wrote the
      # Discord shape with \d and \w inside [...] — literal characters in an ERE — so it could not
      # match a real token anywhere.
      #
      # The selftest runs first: it plants every shape in a temp folder (joined at run time, so no
      # literal shape is committed) and fails unless each one is caught and the empty / placeholder
      # / fixture-style files pass. A scan that silently stopped matching fails here.
      - name: secret scan selftest (planted shapes are caught)
        run: node .github/scripts/secret-scan.mjs --selftest
      - name: scan the tracked files (*.example included)
        run: node .github/scripts/secret-scan.mjs

  # Dependency advisories, blocking (SECURITY_SUMMARY §9, "No dependency audit in CI").
  # .github/scripts/dep-audit.mjs fails on anything not explained in .github/audit-ignore.json,
  # where each entry names the advisory, the folder and the reason it was judged unreachable.
  # A new advisory is a finding: fix the dependency, do not grow the list.
  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Everything that ships: the three apps, the provisioner, and the telemetry dashboard's web
        # (built into its image). Not audited: loadtest (not deployed), native/ (devDependencies
        # only), packages/* (peer deps, resolved by apps/web). (The telemetry dashboard's old root
        # package.json went with the deprecated Express version it served, deleted 2026-09-25.)
        dir:
          - BCWEB/apps/api
          - BCWEB/apps/web
          - BCWEB/apps/bot
          - BCWEB/apps/provisioner
          - BCWEB/bmm/telemetry-dashboard/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      # The provisioner has no committed lockfile yet (SECURITY_SUMMARY §9: "generate and commit a
      # lockfile for the provisioner"). Until it does, audit the tree npm would resolve today. Only
      # that folder: a lockfile vanishing anywhere else must fail, not be regenerated.
      - name: lockfile for the provisioner (until one is committed)
        if: matrix.dir == 'BCWEB/apps/provisioner'
        working-directory: ${{ matrix.dir }}
        run: test -f package-lock.json || npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      # = `npm audit --omit=dev --audit-level=high`, read from the lockfile (no install needed).
      - name: npm audit --omit=dev (high and critical fail)
        run: node .github/scripts/dep-audit.mjs npm "${{ matrix.dir }}"

  cargo-audit:
    name: cargo audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - BCWEB/native
          - BCWEB/native/core
          - BCWEB/bmm/telemetry-dashboard/server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with: { toolchain: stable }
      - name: install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit (vulnerabilities fail)
        run: node .github/scripts/dep-audit.mjs cargo "${{ matrix.dir }}"
