name: BCWEB CI

# Minimal safety net (see BCWEB/guides/TECH_AUDIT_EN.md §4, P1): catch a broken build,
# a broken API module, an invalid Prisma schema, or a leaked secret at push/PR time —
# the classes of bug that have actually bitten this project. No infra needed; all checks
# run against the source with dummy env.

on:
  push:
    paths: ['BCWEB/**']
  pull_request:
    paths: ['BCWEB/**']

jobs:
  web-build:
    name: Web build (vite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: BCWEB/apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      # no-undef catches bare JSX identifiers used-but-not-imported (the render crashes).
      - run: npm run lint
      # i18n integrity: fails on duplicate dict keys (silent-override bugs) and, in
      # --strict, on any t() key used in code with no DICT.fr entry (silent EN fallback).
      - run: npm run i18n:check
      - run: npx vite build --logLevel error
      # Fail if the entry chunk (what every visitor downloads) regresses past its budget —
      # e.g. a route accidentally eager-imported instead of React.lazy'd.
      - run: npm run budget

  api-check:
    name: API syntax + Prisma + billing tests
    runs-on: ubuntu-latest
    # Throwaway Postgres so the pool-billing integration tests (recomputePoolBytes
    # invariants) run for real; the pure pricing tests need no DB either way.
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: bcwebtest }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/bcwebtest
      DIRECT_DATABASE_URL: postgresql://postgres:test@localhost:5432/bcwebtest
    defaults: { run: { working-directory: BCWEB/apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # node --check every API module — catches syntax errors (build never runs the API).
      - name: node --check all API modules
        working-directory: .
        run: find BCWEB/apps/api/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm ci
      - run: npx prisma generate --schema ../../packages/db/schema.prisma
      - run: npx prisma validate --schema ../../packages/db/schema.prisma
      # Apply the checked-in migrations (the real production boot path) to the throwaway DB…
      - run: npx prisma migrate deploy --schema ../../packages/db/schema.prisma
      # …then assert those migrations reproduce the schema EXACTLY — a schema edit without a
      # matching migration (which migrate deploy would silently skip in prod) fails here.
      - name: migrations reproduce the schema (drift check)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ../../packages/db/schema.prisma --exit-code
      # Full suite: pure pricing math + pool-billing invariants + webhook lifecycle.
      - name: tests
        run: npm test

  native:
    name: Native addon (Rust) build + native-path tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'BCWEB/native' }
      # Rust quality gates (mirror the JS lints): formatting + clippy with warnings denied.
      - name: cargo fmt --check
        working-directory: BCWEB/native
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        working-directory: BCWEB/native
        run: cargo clippy --release -- -D warnings
      # Build the Rust addon (BLAKE3 / off-event-loop zip / zstd / image resize). A compile
      # regression fails here rather than silently shipping the JS fallback everywhere.
      - name: build addon
        working-directory: BCWEB/native
        run: npm install --no-audit --no-fund && npx napi build --platform --release
      - name: api deps
        working-directory: BCWEB/apps/api
        run: npm ci
      # The addon must actually LOAD (else the native path is untested). The other jobs run
      # the suite WITHOUT the addon, so they cover the JS fallback; this covers the native path.
      - name: addon loads (hasNative)
        working-directory: BCWEB/apps/api
        run: node --input-type=module -e "import { hasNative } from './src/lib/native.mjs'; if (!hasNative) { console.error('native addon did not load'); process.exit(1); } console.log('hasNative OK');"
      - name: native-path tests (parity native vs JS)
        working-directory: BCWEB/apps/api
        run: node --test test/native.test.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail if a real-looking secret is committed (Stripe live/webhook, Discord bot token,
      # generic private keys). *.example files are allowed to carry placeholders.
      - name: grep for committed secrets
        run: |
          set -e
          pattern='sk_live_[0-9A-Za-z]{20,}|whsec_[0-9a-f]{32,}|rk_live_[0-9A-Za-z]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|[MN][A-Za-z\d]{23}\.[\w-]{6}\.[\w-]{27,}'
          if git grep -nIE "$pattern" -- ':!*.example' ':!*/guides/*' ':!*.md' ; then
            echo '::error::A real-looking secret appears to be committed (see matches above). Move it to an env var / .env (gitignored).'
            exit 1
          fi
          echo 'No committed secrets detected.'
